name: Build and Push to ECR

on:
  push:
    branches: ["develop"]
    paths-ignore: ['**.md', 'docs/**', '.vscode/**', '.env.example', '.gitignore', '.dockerignore', '.prettierrc', 'eslint.config.mjs']

  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - id: aws-setup
        uses: cura-fitness/cura-devops/.github/actions/aws-setup@master
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set short SHA
        id: sha
        run: |
          echo "SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Compute image tags
        id: tags
        env:
          REGISTRY: ${{ steps.aws-setup.outputs.registry }}
          REPO: ${{ secrets.ECR_REPOSITORY }}
          SHORT: ${{ steps.sha.outputs.SHORT }}
        run: |
          BASE="$REGISTRY/$REPO"
          echo "TAGS=$BASE:dev-sha-$SHORT,$BASE:dev" >> $GITHUB_OUTPUT

      - name: Build, cache, and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.tags.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger DevOps Workflow
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          curl -X POST \
            --fail-with-body \
            -H "Authorization: Bearer ${PAT}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/cura-fitness/cura-devops/actions/workflows/deploy_dev.yml/dispatches \
            -d '{"ref":"master"}'