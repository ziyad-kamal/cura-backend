name: Build and Push to ECR (Prod)

on:
  push:
    branches: ["master"]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', '.vscode/**', '.env.example', '.gitignore', '.dockerignore', '.prettierrc', 'eslint.config.mjs']

  workflow_dispatch:

jobs:

  sonar:
    uses: ./.github/workflows/sonar.yml
    with:
      fail_on_gate: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build-and-push:
    needs: sonar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - id: aws-setup
        uses: ./.github/actions
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set short SHA
        id: sha
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo "SHORT=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Build and tag image
        env:
          ECR_REGISTRY: ${{ steps.aws-setup.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:master-sha-${{ steps.sha.outputs.SHORT }} .

      - name: Push master SHA tag
        if: github.ref == 'refs/heads/master'
        env:
          ECR_REGISTRY: ${{ steps.aws-setup.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:master-sha-${{ steps.sha.outputs.SHORT }}

      - name: Push semver and latest tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ECR_REGISTRY: ${{ steps.aws-setup.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          VERSION: ${{ github.ref_name }}
        run: |
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:master-sha-${{ steps.sha.outputs.SHORT }} $ECR_REGISTRY/$ECR_REPOSITORY:${VERSION#v}
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:master-sha-${{ steps.sha.outputs.SHORT }} $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${VERSION#v}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Trigger DevOps Workflow
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          curl -X POST \
            --fail-with-body \
            -H "Authorization: Bearer ${PAT}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/cura-fitness/cura-devops/actions/workflows/deploy_prod.yml/dispatches \
            -d '{"ref":"master"}'