name: Build and Push to ECR (Prod)

on:
  push:
    branches: ["master"]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', '.vscode/**', '.env.example', '.gitignore', '.dockerignore', '.prettierrc', 'eslint.config.mjs']

  workflow_dispatch:

jobs:

  sonar:
    uses: cura-fitness/cura-devops/.github/workflows/sonar.yml@master
    with:
      fail_on_gate: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build-and-push:
    needs: sonar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - id: aws-setup
        uses: cura-fitness/cura-devops/.github/actions/aws-setup@master
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set short SHA
        id: sha
        run: |
          echo "SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Compute image tags
        id: tags
        env:
          REGISTRY: ${{ steps.aws-setup.outputs.registry }}
          REPO: ${{ secrets.ECR_REPOSITORY }}
          SHORT: ${{ steps.sha.outputs.SHORT }}
          VERSION: ${{ github.ref_name }}
        run: |
          BASE="$REGISTRY/$REPO"
          TAGS="$BASE:master-sha-$SHORT"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAGS="$TAGS,$BASE:${VERSION#v},$BASE:latest"
          fi

          echo "TAGS=$TAGS" >> $GITHUB_OUTPUT

      - name: Build, cache, and push
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.tags.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Trigger DevOps Workflow
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          curl -X POST \
            --fail-with-body \
            -H "Authorization: Bearer ${PAT}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/cura-fitness/cura-devops/actions/workflows/deploy_prod.yml/dispatches \
            -d '{"ref":"master"}'